name: Build local test bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: billlin0904/puretext:render-worker-0.1.8
          cache-from: type=gha

      - name: Pull PureText and test dependencies
        run: |
          docker pull billlin0904/puretext:api-v0.5.2
          docker pull postgres:16-alpine
          docker pull redis:7-alpine

      - name: Export images
        run: |
          docker save billlin0904/puretext:render-worker-0.1.8 | gzip -1 > worker-image.tar.gz
          docker save billlin0904/puretext:api-v0.5.2 | gzip -1 > api-image.tar.gz
          docker save postgres:16-alpine redis:7-alpine | gzip -1 > dependencies.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: puretext-worker-image
          path: worker-image.tar.gz
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: puretext-api-image
          path: api-image.tar.gz
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: puretext-test-dependencies
          path: dependencies.tar.gz
          compression-level: 0
          retention-days: 1
