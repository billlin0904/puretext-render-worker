name: Publish Docker image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build timestamp
        run: echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          build-args: |
            SERVICE_VERSION=0.1.13
            SERVICE_COMMIT=${{ github.sha }}
            SERVICE_BUILT_AT=${{ env.BUILD_TIMESTAMP }}
          tags: |
            billlin0904/puretext:render-worker-latest
            billlin0904/puretext:render-worker-0.1.13
            billlin0904/puretext:render-worker-${{ github.sha }}
            billlin0904/puretext-render-worker:latest
            billlin0904/puretext-render-worker:0.1.13
            billlin0904/puretext-render-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify public image pull
        run: |
          docker logout
          docker pull billlin0904/puretext-render-worker:0.1.13
